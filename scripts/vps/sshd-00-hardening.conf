# Hardened SSH config (loaded before sshd_config defaults; first match wins).
# Every login needs BOTH a registered SSH key AND the account password.
PermitRootLogin no
AllowUsers dev deploy
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey,password
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no

# GitHub Actions deploy account: key + password (password stored as a GitHub secret).
# It can run only the deploy wrapper: no shell, TTY, or forwarding of any kind.
Match User deploy
    ForceCommand /usr/local/sbin/engineerfamily-deploy-wrapper
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
