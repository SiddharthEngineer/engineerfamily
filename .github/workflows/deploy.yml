name: Deploy to VPS
run-name: Deploy ${{ inputs.ref }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - prod
          - preprod
      ref:
        description: "Branch or tag to deploy (e.g. main, v1.2.3, v1.2.3-preprod)"
        required: true

jobs:
  deploy:
    name: SSH deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        run: |
          set -euo pipefail

          environment="${{ inputs.environment }}"

          echo "environment=$environment" >> "$GITHUB_OUTPUT"

      - name: Resolve target commit
        id: target
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          git fetch --prune --force --tags origin +refs/heads/*:refs/remotes/origin/*

          requested_ref="$REQUESTED_REF"
          if [ -z "$requested_ref" ]; then
            echo "ERROR: 'ref' input is required for manual dispatch"
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$requested_ref"; then
            target_sha="$(git rev-parse "refs/tags/$requested_ref^{commit}")"
          elif git show-ref --verify --quiet "refs/remotes/origin/$requested_ref"; then
            target_sha="$(git rev-parse "refs/remotes/origin/$requested_ref^{commit}")"
          else
            echo "ERROR: '$requested_ref' is not a known tag or branch on origin"
            exit 1
          fi

          echo "requested_ref=$requested_ref" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      # Uses the workflow's built-in GITHUB_TOKEN (contents: write); no PAT needed.
      - name: Reset deployment branch
        run: |
          set -euo pipefail
          git push origin "${{ steps.target.outputs.target_sha }}:refs/heads/${{ steps.env.outputs.environment }}" --force

      # The VPS `deploy` account needs key + password, and its host key is pinned.
      # On the VPS it can only run "deploy|status prod|preprod" (sshd ForceCommand),
      # which fetches the branch from GitHub and rebuilds the stack.
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          sudo apt-get install -y -qq sshpass > /dev/null

      - name: Build & restart containers
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          sshpass -e ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" "deploy ${{ steps.env.outputs.environment }}"

      - name: Health check
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          sleep 10
          sshpass -e ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" "status ${{ steps.env.outputs.environment }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed (${{ steps.env.outputs.environment }}) on ${{ steps.target.outputs.requested_ref }}. Check logs above."
