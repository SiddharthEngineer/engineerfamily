services:
  # ─── Edge Router (nginx) ─────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./services/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/strelitzia:/usr/share/nginx/strelitzia:ro
      - ./services/shared:/usr/share/nginx/shared:ro
    depends_on:
      - app
    networks:
      - web
      - dashboard
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ─── Home Page ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
      args:
        UMAMI_APP_ID: ${UMAMI_APP_ID}
        UMAMI_HOST: ${UMAMI_HOST:-https://umami.engineerfamily.net}
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      # Site sign-in (/auth/*, services/app/auth.py). Off while GOOGLE_CLIENT_ID is empty.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SITE_SESSION_SECRET=${SITE_SESSION_SECRET:-}
      - PUBLIC_URL=https://engineerfamily.net
      # Site permissions (services/app/perms.py). No password: env-only mode (SITE_ADMIN_EMAILS are admins, everyone
      # else gets SITE_EVERYONE). The emails seed an empty DB once (make site-db-init creates it).
      - SITE_DATABASE_URL=${SITE_DB_PASSWORD:+postgresql://engineerfamily:${SITE_DB_PASSWORD}@postgres-db:5432/engineerfamily}
      - SITE_ADMIN_EMAILS=${SITE_ADMIN_EMAILS:-}
      - SITE_MEMBER_EMAILS=${SITE_MEMBER_EMAILS:-}
      # Pages for visitors who are signed out or not invited (the whole site stays public).
      - SITE_EVERYONE=site
    ports:
      - "127.0.0.1:8000:8000"  # loopback only; nginx reaches app over the web network
    networks:
      - web
      - sitedb

  # ─── Streamlit ────────────────────────────────────────
  # Off by default (unused). Enable with COMPOSE_PROFILES=streamlit, and restore its nginx proxy vhost.
  streamlit:
    profiles: [streamlit]
    build:
      context: ./services/streamlit
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - UMAMI_HOST=${UMAMI_HOST:-https://umami.engineerfamily.net}
      - UMAMI_STREAMLIT_ID=${UMAMI_STREAMLIT_ID:-}
    ports:
      - "127.0.0.1:8501:8501"
    networks:
      - web

  # ─── Analytics (Umami – self-hosted, privacy-first) ───────────────────────
  # Off by default to save ~250 MB RAM per stack. Enable with COMPOSE_PROFILES=umami (in .env or the shell).
  umami:
    profiles: [umami]
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@postgres-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - web

  # Postgres for umami (its superuser), Strelitzia (role and DBs `strelitzia`, `strelitzia_test`; make strelitzia-db-init)
  # and site permissions (role and DB `engineerfamily`; make site-db-init).
  postgres-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - postgres_db:/var/lib/postgresql/data
    # Loopback only, for the host's Strelitzia CLI.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - web
      - dashboard
      - sitedb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Strelitzia dashboard (engineerfamily.net/strelitzia/dashboard/, identity from nginx auth_request) ───
  # Built from /srv/Strelitzia-prod, a detached trunk commit; `make strelitzia-deploy` moves it and rebuilds just this service.
  strelitzia:
    build:
      context: ../Strelitzia-prod
    restart: unless-stopped
    # Runs as the host user that owns ~/.strelitzia (dev), at the same HOME path, so the files it writes stay
    # dev's and the absolute paths stored in the DB resolve. Override with APPLYPILOT_UID/GID in .env.
    user: "${APPLYPILOT_UID:-1000}:${APPLYPILOT_GID:-1001}"
    environment:
      # Beats the host-only 127.0.0.1 URL in ~/.strelitzia/.env (a process env var wins over .env, whichever name it uses).
      - STRELITZIA_DATABASE_URL=postgresql://strelitzia:${STRELITZIA_DB_PASSWORD}@postgres-db:5432/strelitzia
    volumes:
      # Profile, resume template, content library, Drive token, llm_usage.json, tailored files, and .env (the Gemini key).
      - /home/dev/.strelitzia:/home/dev/.strelitzia
    depends_on:
      postgres-db:
        condition: service_healthy
    # Only on `dashboard` (nginx, postgres-db), so nothing else can send it X-Auth-Request-* headers. Egress still works.
    networks:
      - dashboard

  # ─── Wordle solver (engineerfamily.net/wordle/, public, rate-limited in nginx) ───
  # Built from /srv/Wordle-prod, a detached commit of SiddharthEngineer/Wordle; `make wordle-deploy` moves it and rebuilds just this service.
  wordle:
    build:
      context: ../Wordle-prod
    restart: unless-stopped
    # Scoring is CPU-heavy and the page is public: cap it so it can't starve the rest of the stack.
    cpus: 1.0
    mem_limit: 1g
    # Only on `web`: no DB, no identity headers.
    networks:
      - web

networks:
  # nginx, strelitzia and postgres-db only: strelitzia trusts X-Auth-Request-* headers, which only nginx may set.
  dashboard:
    driver: bridge
  # app and postgres-db only: the site permissions DB, without putting app on dashboard.
  sitedb:
    driver: bridge

volumes:
  nivi_content:
  # Pinned to the volume's name from when the service was analytics-db (2026-10), so the data stays put.
  postgres_db:
    name: engineerfamily_analytics_db
