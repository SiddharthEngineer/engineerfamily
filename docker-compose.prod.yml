services:
  # ─── Edge Router (nginx) ─────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./services/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/applypilot:/usr/share/nginx/applypilot:ro
      - ./services/nginx/.htpasswd-applypilot:/etc/nginx/.htpasswd-applypilot:ro
    depends_on:
      - app
      - umami
      - streamlit
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ─── Home Page ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
      args:
        UMAMI_APP_ID: ${UMAMI_APP_ID}
        UMAMI_HOST: ${UMAMI_HOST:-https://umami.engineerfamily.net}
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
    ports:
      - "127.0.0.1:8000:8000"  # loopback only; nginx reaches app over the web network
    networks:
      - web

  # ─── Streamlit ────────────────────────────────────────
  streamlit:
    build:
      context: ./services/streamlit
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - UMAMI_HOST=${UMAMI_HOST:-https://umami.engineerfamily.net}
      - UMAMI_STREAMLIT_ID=${UMAMI_STREAMLIT_ID:-}
    ports:
      - "127.0.0.1:8501:8501"
    networks:
      - web

  # ─── Analytics (Umami – self-hosted, privacy-first) ───────────────────────
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@analytics-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
    depends_on:
      analytics-db:
        condition: service_healthy
    networks:
      - web

  analytics-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - analytics_db:/var/lib/postgresql/data
    # Loopback only: the host's ApplyPilot CLI uses the `applypilot` DB (make applypilot-db-init).
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ApplyPilot dashboard (applypilot.engineerfamily.net/app/, basic auth in nginx) ───
  # Built from the sibling checkout /srv/ApplyPilot; `make applypilot-up` rebuilds just this service.
  applypilot:
    build:
      context: ../ApplyPilot
    restart: unless-stopped
    # Runs as the host user that owns ~/.applypilot (dev), at the same HOME path, so the files it writes stay
    # dev's and the absolute paths stored in the DB resolve. Override with APPLYPILOT_UID/GID in .env.
    user: "${APPLYPILOT_UID:-1000}:${APPLYPILOT_GID:-1001}"
    environment:
      # Overrides the host-only 127.0.0.1 URL in ~/.applypilot/.env (load_dotenv never overrides set variables).
      - APPLYPILOT_DATABASE_URL=postgresql://applypilot:${APPLYPILOT_DB_PASSWORD}@analytics-db:5432/applypilot
    volumes:
      # Profile, resume template, content library, Drive token, llm_usage.json, tailored files.
      - /home/dev/.applypilot:/home/dev/.applypilot
      # Gemini key + LLM limits (multi-line JSON values, so not env_file); load_env reads the CWD .env.
      - ../ApplyPilot/.env:/app/.env:ro
    depends_on:
      analytics-db:
        condition: service_healthy
    networks:
      - web

volumes:
  nivi_content:
  analytics_db:
