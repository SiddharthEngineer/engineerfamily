# Preprod stack – fully independent from the production stack.
# Usage: docker compose -f docker-compose.base.yml -f docker-compose.preprod.yml up -d

services:
  # ─── Edge Router (nginx) ─────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./services/nginx/nginx.preprod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/strelitzia:/usr/share/nginx/strelitzia:ro
      - ./services/shared:/usr/share/nginx/shared:ro
    depends_on:
      - app
      - strelitzia
      - wordle
    networks:
      - web
      - dashboard
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ─── Home Page ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
      args:
        UMAMI_APP_ID: ${UMAMI_APP_ID}
        UMAMI_HOST: ${UMAMI_HOST:-https://umami.engineerfamily.net}
    restart: unless-stopped
    environment:
      - FLASK_ENV=development
      # Site sign-in (/auth/*, services/app/auth.py). Off while GOOGLE_CLIENT_ID is empty.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SITE_SESSION_SECRET=${SITE_SESSION_SECRET:-}
      - PUBLIC_URL=https://preprod.engineerfamily.net
      # Site permissions (services/app/perms.py). No password: env-only mode (SITE_ADMIN_EMAILS are admins, everyone
      # else gets SITE_EVERYONE). The emails seed an empty DB once (make preprod-site-db-init creates it).
      - SITE_DATABASE_URL=${SITE_DB_PASSWORD_PREPROD:+postgresql://engineerfamily:${SITE_DB_PASSWORD_PREPROD}@postgres-db:5432/engineerfamily_preprod}
      - SITE_ADMIN_EMAILS=${SITE_ADMIN_EMAILS:-}
      - SITE_MEMBER_EMAILS=${SITE_MEMBER_EMAILS:-}
      # Pages for visitors who are signed out or not invited (none: preprod is invite-only once part 3 gates it).
      - SITE_EVERYONE=
    networks:
      - web
      - sitedb

  # ─── Streamlit ────────────────────────────────────────
  # Off by default (unused). Enable with COMPOSE_PROFILES=streamlit, and restore its nginx proxy vhost.
  streamlit:
    profiles: [streamlit]
    build:
      context: ./services/streamlit
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - UMAMI_HOST=${UMAMI_HOST:-https://umami.engineerfamily.net}
      - UMAMI_STREAMLIT_ID=${UMAMI_STREAMLIT_ID:-}
    networks:
      - web

  # ─── Analytics (Umami – self-hosted, privacy-first) ───────────────────────
  # Off by default to save ~250 MB RAM per stack. Enable with COMPOSE_PROFILES=umami (in .env or the shell).
  umami:
    profiles: [umami]
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD_PREPROD}@postgres-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET_PREPROD}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - web

  postgres-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD_PREPROD}
    volumes:
      - postgres_db_preprod:/var/lib/postgresql/data
    networks:
      - web
      - dashboard
      - sitedb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Strelitzia dashboard (review PRs; preprod.engineerfamily.net/strelitzia/dashboard/, health at 127.0.0.1:8080) ───
  # Built from /srv/Strelitzia-preprod, which scripts/agent/preprod.sh (Strelitzia repo) checks out at the PR head.
  # Disposable data only: its own strelitzia_preprod DB and an empty app dir, never prod's ~/.strelitzia or LLM keys.
  strelitzia:
    build:
      context: ../Strelitzia-preprod
    restart: unless-stopped
    user: "${APPLYPILOT_UID:-1000}:${APPLYPILOT_GID:-1001}"
    environment:
      - STRELITZIA_DATABASE_URL=postgresql://strelitzia:${STRELITZIA_DB_PASSWORD_PREPROD}@postgres-db:5432/strelitzia_preprod
    volumes:
      - ${STRELITZIA_PREPROD_DATA:-/home/dev/.strelitzia-preprod}:/home/dev/.strelitzia
    depends_on:
      postgres-db:
        condition: service_healthy
    # Only on `dashboard` (nginx, postgres-db), so nothing else can send it X-Auth-Request-* headers. Egress still works.
    networks:
      - dashboard

  # ─── Wordle solver (preprod.engineerfamily.net/wordle/, health at 127.0.0.1:8080, public, rate-limited in nginx) ───
  # Built from /srv/Wordle-preprod, a detached commit of SiddharthEngineer/Wordle; `make preprod-wordle-deploy` moves it (or `make preprod-deploy` rebuilds it with the rest).
  wordle:
    build:
      context: ../Wordle-preprod
    restart: unless-stopped
    # Scoring is CPU-heavy and the page is public: cap it so it can't starve the rest of the stack.
    cpus: 1.0
    mem_limit: 1g
    # Only on `web`: no DB, no identity headers.
    networks:
      - web

networks:
  # nginx, strelitzia and postgres-db only: strelitzia trusts X-Auth-Request-* headers, which only nginx may set.
  dashboard:
    driver: bridge
  # app and postgres-db only: the site permissions DB, without putting app on dashboard.
  sitedb:
    driver: bridge

volumes:
  # Pinned to the volume's name from when the service was analytics-db (2026-10), so the data stays put.
  postgres_db_preprod:
    name: engineerfamily-preprod_analytics_db_preprod
