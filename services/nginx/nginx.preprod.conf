resolver 127.0.0.11 valid=10s ipv6=off;
# Relative Location headers, so redirects keep the client's https and never leak the internal port (8080 on preprod).
absolute_redirect off;

server {
    listen 80;
    listen [::]:80;
    server_name preprod.engineerfamily.net;

    location / {
        auth_basic "Preprod";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $upstream_app http://app:8000;
        proxy_pass $upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strelitzia: static homepage + privacy policy, from services/strelitzia.
    location = /strelitzia {
        return 301 /strelitzia/;
    }

    location /strelitzia/ {
        auth_basic "Preprod";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    # Job dashboard (Strelitzia `serve` container at a review PR's head).
    location /strelitzia/dashboard/ {
        auth_basic "Preprod";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $upstream_strelitzia http://strelitzia:8000;
        proxy_pass $upstream_strelitzia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

