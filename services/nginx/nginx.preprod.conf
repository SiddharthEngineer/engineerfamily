# Preprod: main by default; the agent-runner's preprod lock deploys one PR head at a time here (make preprod-deploy ref=<branch>).
resolver 127.0.0.11 valid=10s ipv6=off;
# Relative Location headers, so redirects keep the client's https and never leak the internal port (8080 on preprod).
absolute_redirect off;
# Wordle API rate limit, per visitor: $remote_addr is always a Cloudflare IP here, so key on CF-Connecting-IP (the
# client address Cloudflare sets), falling back to $remote_addr for requests that don't come through Cloudflare.
map $http_cf_connecting_ip $wordle_client {
    "" $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $wordle_client zone=wordle_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name preprod.engineerfamily.net;

    # Preprod's Everyone row has no Site grant, so it is sign-in-only; keep it out of search anyway. add_header in a
    # location replaces these server-level ones: every location here with its own add_header repeats X-Robots-Tag.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Site permissions (README.md, Routing): every page on this host needs the Site grant. A location with its own
    # auth_request (the dashboard, /bracket/) replaces this one; `auth_request off` marks the paths that stay open. A
    # refusal shows Flask's /auth/denied page: 401 "Sign in to continue" signed out, 403 "Ask an admin" signed in.
    auth_request /_auth_site;
    error_page 401 = @denied401;
    error_page 403 = @denied403;

    location = /robots.txt {
        auth_request off;
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        set $upstream_app http://app:8000;
        proxy_pass $upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Open without Site: sign-in, sign-out and the no-access page (/auth/), the privacy policy (Google's consent screen
    # links it), the favicon, and the Vite bundle (static, no data). /auth/verify stays a 404 (exact match wins).
    location ~ ^/(auth/|assets/|privacy$|favicon\.ico$) {
        auth_request off;
        set $upstream_app http://app:8000;
        proxy_pass $upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shared header script (<ef-home>, <ef-profile>) from services/shared; no-cache so a change shows at once. `always`
    # so a 404 isn't cached either. Cloudflare's Browser Cache TTL is "Respect Existing Headers" (set 2026-10-19); any
    # other value rewrites this to max-age=14400 on .js/.css (README.md, Cloudflare).
    location /shared/ {
        auth_request off;
        root /usr/share/nginx;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Strelitzia: static homepage + privacy policy, from services/strelitzia.
    location = /strelitzia {
        return 301 /strelitzia/;
    }

    # The Strelitzia privacy policy (Google's consent screen links it) and what it loads stay open; the rest of
    # /strelitzia/ (the about page) needs Site.
    location ~ ^/strelitzia/(privacy(\.html)?|style\.css|favicon\.svg)$ {
        auth_request off;
        root /usr/share/nginx;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html =404;
    }

    location /strelitzia/ {
        root /usr/share/nginx;
        index index.html;
        # Pages, style.css and favicon: revalidate every time (cheap 304s), so a deploy shows at once.
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Wordle solver (`wordle` container, SiddharthEngineer/Wordle), under Site; it serves under /wordle/
    # itself, so the URI goes through unchanged. /wordle/api/ scores guesses (CPU-heavy), so it's rate-limited.
    location = /wordle {
        return 301 /wordle/;
    }

    location /wordle/ {
        set $upstream_wordle http://wordle:8000;
        proxy_pass $upstream_wordle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location /wordle/api/ {
            set $upstream_wordle http://wordle:8000;
            proxy_pass $upstream_wordle;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=wordle_api burst=10 nodelay;
            limit_req_status 429;
            proxy_read_timeout 30s;
            client_max_body_size 16k;
            gzip on;
            gzip_types application/json;
        }
    }

    # nginx-only permission checks (auth_request), one per page key in services/app/perms.py: Flask answers 204 when
    # the visitor may open the page (with X-Auth-Request-Access/-Admin/-Cap-Usd, plus the identity headers when signed
    # in), else 401 signed out or 403 signed in. Not public: /auth/verify itself is a 404 from outside.
    location = /_auth_site {
        internal;
        auth_request off;
        set $upstream_auth_site http://app:8000/auth/verify?page=site;
        proxy_pass $upstream_auth_site;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth_strelitzia {
        internal;
        auth_request off;
        set $upstream_auth_strelitzia http://app:8000/auth/verify?page=strelitzia;
        proxy_pass $upstream_auth_strelitzia;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth_bracket {
        internal;
        auth_request off;
        set $upstream_auth_bracket http://app:8000/auth/verify?page=bracket;
        proxy_pass $upstream_auth_bracket;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The no-access page for a refused request, whatever its method; the refused path goes in X-Original-URI so Flask
    # can offer Sign in and come back to it.
    location @denied401 {
        auth_request off;
        set $upstream_auth_denied http://app:8000/auth/denied?status=401;
        proxy_pass $upstream_auth_denied;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
    }

    location @denied403 {
        auth_request off;
        set $upstream_auth_denied http://app:8000/auth/denied?status=403;
        proxy_pass $upstream_auth_denied;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /auth/verify {
        return 404;
    }

    # Job dashboard (Strelitzia `serve` container at a review PR's head, STRELITZIA_AUTH_MODE=proxy), gated by
    # auth_request. proxy_set_header replaces any client copy of the X-Auth-Request-* headers,
    # and an empty value (signed out) drops the header. Every location that proxies to strelitzia must set all six.
    location /strelitzia/dashboard/ {
        auth_request /_auth_strelitzia;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_name $upstream_http_x_auth_request_preferred_username;
        auth_request_set $auth_access $upstream_http_x_auth_request_access;
        auth_request_set $auth_admin $upstream_http_x_auth_request_admin;
        auth_request_set $auth_cap $upstream_http_x_auth_request_cap_usd;
        set $upstream_strelitzia http://strelitzia:8000;
        proxy_pass $upstream_strelitzia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Preferred-Username $auth_name;
        proxy_set_header X-Auth-Request-Access $auth_access;
        proxy_set_header X-Auth-Request-Admin $auth_admin;
        proxy_set_header X-Auth-Request-Cap-Usd $auth_cap;
        proxy_read_timeout 120s;
        client_max_body_size 2m;

        # Built UI files need no identity: skip the Flask round trip per file, and still drop client identity headers.
        location /strelitzia/dashboard/assets/ {
            auth_request off;
            set $upstream_strelitzia http://strelitzia:8000;
            proxy_pass $upstream_strelitzia;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-Request-Email "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header X-Auth-Request-Preferred-Username "";
            proxy_set_header X-Auth-Request-Access "";
            proxy_set_header X-Auth-Request-Admin "";
            proxy_set_header X-Auth-Request-Cap-Usd "";
        }
    }

    # Bracket Analyzer (future): needs the Bracket Analyzer grant. Until it exists the app answers 404; a bare `return`
    # would run before auth_request and skip the check.
    location /bracket/ {
        auth_request /_auth_bracket;
        set $upstream_app http://app:8000;
        proxy_pass $upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        auth_request off;
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name umami-preprod.engineerfamily.net;

    location / {
        set $upstream_umami http://umami:3000;
        proxy_pass $upstream_umami;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Streamlit is off (compose profile `streamlit`). To bring it back, restore the proxy to http://streamlit:8501
# (with the websocket Upgrade headers) from git history.
server {
    listen 80;
    listen [::]:80;
    server_name streamlit-preprod.engineerfamily.net;

    location / {
        return 301 https://preprod.engineerfamily.net/;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Old dashboard hostname: 301 to preprod.engineerfamily.net (the ef_session cookie is host-only), like prod's strelitzia.*.
server {
    listen 80;
    listen [::]:80;
    server_name strelitzia-preprod.engineerfamily.net;

    location /strelitzia/ {
        return 301 https://preprod.engineerfamily.net$request_uri;
    }

    location = /app {
        return 301 https://preprod.engineerfamily.net/strelitzia/dashboard/;
    }

    location ~ ^/app/(.*)$ {
        return 301 https://preprod.engineerfamily.net/strelitzia/dashboard/$1$is_args$args;
    }

    location / {
        return 301 https://preprod.engineerfamily.net/strelitzia$request_uri;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# The host's health checks: http://127.0.0.1:8080/strelitzia/dashboard/api/health (Strelitzia's scripts/agent/preprod.sh)
# and http://127.0.0.1:8080/wordle/api/health. Only those paths, with no identity (no auth_request, headers dropped).
server {
    listen 80;
    listen [::]:80;
    server_name 127.0.0.1 localhost;

    location = /wordle/api/health {
        set $upstream_wordle http://wordle:8000;
        proxy_pass $upstream_wordle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /strelitzia/dashboard/api/health {
        set $upstream_strelitzia http://strelitzia:8000;
        proxy_pass $upstream_strelitzia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Auth-Request-Access "";
        proxy_set_header X-Auth-Request-Admin "";
        proxy_set_header X-Auth-Request-Cap-Usd "";
    }

    location / {
        return 404;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Old ApplyPilot hostname: permanent redirect to Strelitzia, keeping the path (old bookmarks, Google consent-screen links).
server {
    listen 80;
    listen [::]:80;
    server_name applypilot-preprod.engineerfamily.net;

    location / {
        return 301 https://strelitzia-preprod.engineerfamily.net$request_uri;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
