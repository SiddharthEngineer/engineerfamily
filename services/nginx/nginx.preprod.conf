# Streamlit is off (compose profile `streamlit`). To bring it back, restore the proxy to http://streamlit:8501
# (with basic auth and the websocket Upgrade headers) from git history.
server {
    listen 80;
    listen [::]:80;
    server_name streamlit-preprod.engineerfamily.net;

    location / {
        return 301 https://preprod.engineerfamily.net/;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 80;
    listen [::]:80;
    # 127.0.0.1/localhost let the host health-check the dashboard at http://127.0.0.1:8080/strelitzia/dashboard/api/health.
    server_name strelitzia-preprod.engineerfamily.net 127.0.0.1 localhost;

    # The static pages link to /strelitzia/... as on preprod.engineerfamily.net, so serve them there too.
    location / {
        return 301 /strelitzia$request_uri;
    }

    location /strelitzia/ {
        auth_basic "Preprod";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    # Job dashboard (Strelitzia `serve` container at a review PR's head). It moved from /app/ to
    # /strelitzia/dashboard/; /app/ stays while review PRs branched before the move still reach preprod.
    location /strelitzia/dashboard/ {
        auth_basic "Preprod";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $upstream_strelitzia http://strelitzia:8000;
        proxy_pass $upstream_strelitzia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }

    location /app/ {
        auth_basic "Preprod";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $upstream_strelitzia http://strelitzia:8000;
        proxy_pass $upstream_strelitzia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Old ApplyPilot hostname: permanent redirect to Strelitzia, keeping the path (old bookmarks, Google consent-screen links).
server {
    listen 80;
    listen [::]:80;
    server_name applypilot-preprod.engineerfamily.net;

    location / {
        return 301 https://strelitzia-preprod.engineerfamily.net$request_uri;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
