# Preprod: main by default; the agent-runner's preprod lock deploys one PR head at a time here (make preprod-deploy ref=<sha>).
resolver 127.0.0.11 valid=10s ipv6=off;
# Relative Location headers, so redirects keep the client's https and never leak the internal port (8080 on preprod).
absolute_redirect off;

server {
    listen 80;
    listen [::]:80;
    server_name preprod.engineerfamily.net;

    # Preprod is open like prod (Google sign-in gates the dashboard), so keep it out of search. add_header in a location
    # replaces these server-level ones: every location here with its own add_header repeats X-Robots-Tag.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        set $upstream_app http://app:8000;
        proxy_pass $upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shared header script (<ef-home>, <ef-profile>) from services/shared; no-cache so a change shows at once. `always`
    # so a 404 isn't cached either. Cloudflare's Browser Cache TTL is "Respect Existing Headers" (set 2026-10-19); any
    # other value rewrites this to max-age=14400 on .js/.css (README.md, Cloudflare).
    location /shared/ {
        root /usr/share/nginx;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Strelitzia: static homepage + privacy policy, from services/strelitzia.
    location = /strelitzia {
        return 301 /strelitzia/;
    }

    location /strelitzia/ {
        root /usr/share/nginx;
        index index.html;
        # Pages, style.css and favicon: revalidate every time (cheap 304s), so a deploy shows at once.
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # nginx-only identity check for the dashboard (auth_request): Flask answers 204, with the X-Auth-Request-* headers
    # only when the ef_session cookie is signed in. Not public: /auth/verify itself is a 404 from outside.
    location = /_auth_verify {
        internal;
        set $upstream_auth_verify http://app:8000/auth/verify;
        proxy_pass $upstream_auth_verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth/verify {
        return 404;
    }

    # Job dashboard (Strelitzia `serve` container at a review PR's head, STRELITZIA_AUTH_MODE=proxy), gated by
    # auth_request. proxy_set_header replaces any client copy of the X-Auth-Request-* headers,
    # and an empty value (signed out) drops the header. Every location that proxies to strelitzia must set all three.
    location /strelitzia/dashboard/ {
        auth_request /_auth_verify;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_name $upstream_http_x_auth_request_preferred_username;
        set $upstream_strelitzia http://strelitzia:8000;
        proxy_pass $upstream_strelitzia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Preferred-Username $auth_name;
        proxy_read_timeout 120s;
        client_max_body_size 2m;

        # Built UI files need no identity: skip the Flask round trip per file, and still drop client identity headers.
        location /strelitzia/dashboard/assets/ {
            auth_request off;
            set $upstream_strelitzia http://strelitzia:8000;
            proxy_pass $upstream_strelitzia;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-Request-Email "";
            proxy_set_header X-Auth-Request-User "";
            proxy_set_header X-Auth-Request-Preferred-Username "";
        }
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name umami-preprod.engineerfamily.net;

    location / {
        set $upstream_umami http://umami:3000;
        proxy_pass $upstream_umami;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Streamlit is off (compose profile `streamlit`). To bring it back, restore the proxy to http://streamlit:8501
# (with the websocket Upgrade headers) from git history.
server {
    listen 80;
    listen [::]:80;
    server_name streamlit-preprod.engineerfamily.net;

    location / {
        return 301 https://preprod.engineerfamily.net/;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Old dashboard hostname: 301 to preprod.engineerfamily.net (the ef_session cookie is host-only), like prod's strelitzia.*.
server {
    listen 80;
    listen [::]:80;
    server_name strelitzia-preprod.engineerfamily.net;

    location /strelitzia/ {
        return 301 https://preprod.engineerfamily.net$request_uri;
    }

    location = /app {
        return 301 https://preprod.engineerfamily.net/strelitzia/dashboard/;
    }

    location ~ ^/app/(.*)$ {
        return 301 https://preprod.engineerfamily.net/strelitzia/dashboard/$1$is_args$args;
    }

    location / {
        return 301 https://preprod.engineerfamily.net/strelitzia$request_uri;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# The host's health check of the dashboard: http://127.0.0.1:8080/strelitzia/dashboard/api/health (Strelitzia's
# scripts/agent/preprod.sh). Only that path, with no identity (no auth_request, headers dropped).
server {
    listen 80;
    listen [::]:80;
    server_name 127.0.0.1 localhost;

    location = /strelitzia/dashboard/api/health {
        set $upstream_strelitzia http://strelitzia:8000;
        proxy_pass $upstream_strelitzia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
    }

    location / {
        return 404;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Old ApplyPilot hostname: permanent redirect to Strelitzia, keeping the path (old bookmarks, Google consent-screen links).
server {
    listen 80;
    listen [::]:80;
    server_name applypilot-preprod.engineerfamily.net;

    location / {
        return 301 https://strelitzia-preprod.engineerfamily.net$request_uri;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
