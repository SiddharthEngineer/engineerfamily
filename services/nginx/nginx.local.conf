resolver 127.0.0.11 valid=10s ipv6=off;
# Relative Location headers, so redirects keep the client's https and never leak the internal port (8080 on preprod).
absolute_redirect off;

server {
    listen 80;
    listen [::]:80;
    server_name engineerfamily.test;

    location / {
        set $upstream_app http://app:8000;
        proxy_pass $upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strelitzia static homepage + privacy policy (the dashboard container isn't in the local stack).
    location = /strelitzia {
        return 301 /strelitzia/;
    }

    location /strelitzia/ {
        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Streamlit is off (compose profile `streamlit`); restore the proxy to http://streamlit:8501 from git history to use it.
server {
    listen 80;
    listen [::]:80;
    server_name streamlit.engineerfamily.test;

    location / {
        return 301 http://engineerfamily.test/;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name umami.engineerfamily.test;

    location / {
        set $upstream_umami http://umami-local:3000;
        proxy_pass $upstream_umami;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Old Strelitzia hostname: permanent redirect to engineerfamily.test/strelitzia/, keeping the path.
server {
    listen 80;
    listen [::]:80;
    server_name strelitzia.engineerfamily.test;

    location / {
        return 301 http://engineerfamily.test/strelitzia$request_uri;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
