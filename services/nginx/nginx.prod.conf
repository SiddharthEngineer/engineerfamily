# ApplyPilot: static homepage + privacy policy (Google OAuth consent screen links here)
server {
    listen 80;
    listen [::]:80;
    server_name applypilot.engineerfamily.net;

    root /usr/share/nginx/applypilot;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Job dashboard (ApplyPilot `serve` container), password-protected.
    location /app/ {
        auth_basic "ApplyPilot";
        auth_basic_user_file /etc/nginx/.htpasswd-applypilot;
        set $upstream_applypilot http://applypilot:8000;
        proxy_pass $upstream_applypilot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
