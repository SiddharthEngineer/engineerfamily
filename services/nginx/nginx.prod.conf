resolver 127.0.0.11 valid=10s ipv6=off;
# Relative Location headers, so redirects keep the client's https and never leak the internal port (8080 on preprod).
absolute_redirect off;

server {
    listen 80;
    listen [::]:80;
    server_name engineerfamily.net www.engineerfamily.net;

    location / {
        set $upstream_app http://app:8000;
        proxy_pass $upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strelitzia: static homepage + privacy policy (Google OAuth consent screen links here), from services/strelitzia.
    location = /strelitzia {
        return 301 /strelitzia/;
    }

    location /strelitzia/ {
        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    # Job dashboard (Strelitzia `serve` container). The app does its own Google sign-in, so no basic auth here.
    location /strelitzia/dashboard/ {
        set $upstream_strelitzia http://strelitzia:8000;
        proxy_pass $upstream_strelitzia;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Streamlit is off (compose profile `streamlit`). To bring it back, restore the proxy to http://streamlit:8501
# (with the websocket Upgrade headers) from git history.
server {
    listen 80;
    listen [::]:80;
    server_name streamlit.engineerfamily.net;

    location / {
        return 301 https://engineerfamily.net/;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

