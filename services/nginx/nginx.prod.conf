# Old Strelitzia and ApplyPilot hostnames: permanent redirect to engineerfamily.net/strelitzia/, keeping the path
# (old bookmarks, Google consent-screen links). The dashboard moved from /app/ to /strelitzia/dashboard/.
server {
    listen 80;
    listen [::]:80;
    server_name strelitzia.engineerfamily.net applypilot.engineerfamily.net;

    location = /app {
        return 301 https://engineerfamily.net/strelitzia/dashboard/;
    }

    location ~ ^/app/(.*)$ {
        return 301 https://engineerfamily.net/strelitzia/dashboard/$1$is_args$args;
    }

    location / {
        return 301 https://engineerfamily.net/strelitzia$request_uri;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
