# Which version of each child repo prod runs. Prod deploys check these tags out before they build; only
# `make prod-release` moves them (one "Release pins: …" PR per release), and `hold` keeps it from moving one.
# Preprod floats on each child's newest tag instead; `preprod = "<tag|branch>"` freezes it (see agents/DEPLOY.md).
[strelitzia]
repo = "SiddharthEngineer/Strelitzia"
tag = "v1.2.7"
service = "strelitzia"

[wordle]
repo = "SiddharthEngineer/Wordle"
tag = "v1.1.0"
service = "wordle"
# hold = "reason"   # optional: prod-release leaves this pin alone and lists the reason
