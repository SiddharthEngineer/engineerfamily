# engineerfamily as a repo the shared runner builds (agent-runner design D5). Read by the runner from origin/main only.
# Prod stays manual: config.py refuses any preprod command that mentions a prod target, project or checkout.
[repo]
name = "engineerfamily"
github = "SiddharthEngineer/engineerfamily"
base = "main"
merge = "merge"

[validate]
fast = "scripts/validate.sh"
full = "scripts/validate.sh"

[gate]
high_risk = [
    "services/nginx/*",
    "docker-compose*.yml",
    "Makefile",
    "scripts/*",
    "services/*/Dockerfile",
    ".github/*",
    "*htpasswd*",
    ".env*",
    "agents/runner.toml",
    "agents/settings/*",
    ".claude/settings.json",
]
doc_or_test = ["*.md", "agents/*", ".claude/commands/*", "tests/*"]

[preprod]
# {sha} is the PR head; preprod-deploy fetches every branch into /srv/engineerfamily-preprod, so agent/<slug> is there.
deploy = "make -C /srv/engineerfamily-preprod preprod-deploy ref={sha}"
release = "make -C /srv/engineerfamily-preprod preprod-deploy"
netrc_env = "PREPROD_NETRC"
# Only paths that answer signed out, before and after the Site gate (site-perms-3): preprod's Everyone row has no Site
# grant, so `/`, `/strelitzia/` and the API health URLs are 401 through Cloudflare. The public ones go through
# Cloudflare, proving the host routes to the right nginx and app; the API health checks use nginx's 127.0.0.1:8080
# health server (no auth_request), which preprod.sh can reach because it runs on the VPS.
health = [
    { url = "https://preprod.engineerfamily.net/healthz", status = 200 },
    { url = "https://preprod.engineerfamily.net/privacy", status = 200 },
    { url = "https://preprod.engineerfamily.net/strelitzia/privacy", status = 200 },
    { url = "http://127.0.0.1:8080/strelitzia/dashboard/api/health", json_ok = true },
    { url = "http://127.0.0.1:8080/wordle/api/health", json_ok = true },
]

[release]
tags = true
